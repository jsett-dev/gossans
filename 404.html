<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &middot; Gossan Advisory</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
:root {
  color-scheme: light;
  --paper: #f1f2ef;
  --ink: #14181a;
  --ink-2: #444b4d;
  --ink-3: #6d7573;
  --rule: #c7ccc5;
  --draft: #22506b;
  --redline: #a3301f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #14181a;
    --ink: #e8eae5;
    --ink-2: #b3bab8;
    --ink-3: #838c8a;
    --rule: #2d3538;
    --draft: #6ba3c6;
    --redline: #dd7361;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-content: center;
  gap: 0;
  padding: 40px 32px;
  background: var(--paper);
  color: var(--ink);
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 17px;
  line-height: 1.6;
}
.wrap { max-width: 46ch; }
.mark {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 34px;
}
.mark i {
  width: 12px;
  height: 12px;
  background: var(--redline);
  display: block;
}
.mark span {
  font-family: "Archivo", Arial, sans-serif;
  font-weight: 800;
  font-size: 21px;
  letter-spacing: -.03em;
}
.code {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding-bottom: 8px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--rule);
}
h1 {
  font-family: "Archivo", Arial, sans-serif;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.1;
  margin: 0 0 14px;
  text-wrap: balance;
}
p { margin: 0 0 22px; color: var(--ink-2); }
a.back {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--paper);
  background: var(--ink);
  border: 1px solid var(--ink);
  padding: 12px 22px;
  text-decoration: none;
  display: inline-block;
}
a.back:hover { background: var(--draft); border-color: var(--draft); color: #fff; }
a.back:focus-visible { outline: 2px solid var(--redline); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><i></i><span>Gossan</span></div>
    <div class="code">Error 404 &middot; No such page</div>
    <h1>Nothing outcrops here.</h1>
    <p>
      The page you asked for does not exist, or it moved. Everything on this
      site lives on one page, so the way back is short.
    </p>
    <a class="back" href="/">Return to the site</a>
  </div>
</body>
</html>
